<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trace</title>
</head>

<body style="margin: 0; padding: 0; overflow: hidden; background: #111113;">
  <div id="root">
    <!-- Static splash shown until React mounts. Must stay identical to the
         startup splash in App.tsx so the hand-over is invisible. -->
    <div style="position: fixed; inset: 0; z-index: 100; background: #111113; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-app-region: drag;">
      <div style="width: 256px; display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: #e4e4e7;">TRACE</span>
          <span style="font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace; font-size: 10px; color: #71717a;">%TRACE_APP_VERSION%</span>
        </div>
        <div style="height: 1px; width: 100%; background: #27272a; overflow: hidden;">
          <div style="height: 100%; width: 15%; background: #47908a;"></div>
        </div>
        <!-- Desktop app only (shown by the script below), same as the React splash. -->
        <div id="trace-build" style="display: none; font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, monospace; font-size: 10px; color: #52525b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">build %TRACE_BUILD_ID%</div>
        <script>
          if (window.electronAPI && window.electronAPI.isDesktop) document.getElementById('trace-build').style.display = 'block';
        </script>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
